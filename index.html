<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Task Management System</h1>
        <p>Organize your tasks and manage your time.</p>
    </header>

    <main>
        <section>
            <h2>Add a New Task</h2>

            <form id="task-form">
                <input type="text" id="task-title" placeholder="Enter task title">

                <textarea id="task-description" placeholder="Enter task description"></textarea>

                <select id="task-priority">
                    <option value="low">Low Priority</option>
                    <option value="medium" selected>Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>

                <button type="submit">Add Task</button>
            </form>
        </section>

        <section>
            <h2>Task Statistics</h2>

            <p>Total Tasks: <span id="total-tasks">0</span></p>
            <p>Completed Tasks: <span id="completed-tasks">0</span></p>
            <p>Pending Tasks: <span id="pending-tasks">0</span></p>
        </section>

        <section>
            <h2>My Tasks</h2>

            <input type="text" id="search-input" placeholder="Search tasks...">

            <div id="filter-buttons">
                <button type="button" data-filter="all">All</button>
                <button type="button" data-filter="pending">Pending</button>
                <button type="button" data-filter="completed">Completed</button>
            </div>


            <div id="task-list">
                <p>No tasks yet.</p>
            </div>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>

</html>
